[build-system]
requires = ["setuptools>=77", "wheel", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hotpants"
version = "0.3.0rc1"
description = "Python interface and numerical backends for HOTPANTS image subtraction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/LICENSE"]
authors = [{name = "Koji Shukawa", email = "kshukawa@stsci.edu"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23.5", "scipy>=1.10", "astropy>=5.2", "numba>=0.57"]

[project.optional-dependencies]
test = ["pytest>=7"]
docs = ["sphinx>=7", "sphinx-rtd-theme", "sphinx-markdown-builder"]

[project.urls]
Homepage = "https://github.com/zoutei/pyhotpants"
Issues = "https://github.com/zoutei/pyhotpants/issues"
Documentation = "https://zoutei.github.io/pyhotpants/"

[tool.pytest.ini_options]
testpaths = ["tests"]
