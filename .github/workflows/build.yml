name: Test and Build
on:
  push:
    branches: [main, development, 'codex/**']
  pull_request:
    branches: [main, development]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      NUMBA_CACHE_DIR: ${{ runner.temp }}/numba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build pytest
      - run: python -m build
      - name: Install built wheel and test it outside the source tree
        shell: bash
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib -q
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/
  native-memory:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: python -m pip install '.[test]'
      - name: Locate installed native package
        working-directory: ${{ runner.temp }}
        run: echo "HP_PACKAGE=$(python -c 'import hotpants; print(hotpants.__path__[0])')" >> "$GITHUB_ENV"
      - name: Valgrind lifetime and failure paths
        run: >-
          valgrind --error-exitcode=86 --leak-check=full
          --errors-for-leak-kinds=definite,indirect --show-leak-kinds=definite,indirect
          python tools/memory_probe.py --package "$HP_PACKAGE" --repeat 10
      - name: Inject native allocation failures
        run: |
          gcc -shared -fPIC -O0 tools/native_alloc_fail.c -ldl -o "$RUNNER_TEMP/alloc_fail.so"
          LD_PRELOAD="$RUNNER_TEMP/alloc_fail.so" python tools/memory_probe.py --package "$HP_PACKAGE" --oom
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[docs]'
      - run: python -m sphinx -W --keep-going -b html docs/source "${{ runner.temp }}/docs"
